<!DOCTYPE html>
<html>
<head>
<style>
.grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
  position: relative;
}
.btn {
  border-radius: 6px;
  padding: 4px 8px;
  color: white;
}
</style>
</head>
<body>
  <div class="grid">
    <div class="btn" style="grid-column: 1 / span 1; grid-row: 1; background: purple;">Event 1</div>
    <div class="btn" style="grid-column: 2 / span 1; grid-row: 2; background: gray;">Event 2</div>
  </div>
</body>
</html>
